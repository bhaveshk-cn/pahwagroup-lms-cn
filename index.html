<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pahwa Group · Learning &amp; Development Platform — Interactive Prototype</title>
<meta name="description" content="Interactive prototype of the Pahwa Group Learning & Development platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C1A36;--ink2:#13264B;--ink3:#1C3466;
  --brand:#2457E6;--brand-d:#1B45BC;--brand-l:#E8EEFD;
  --teal:#0E8A93;--teal-l:#E0F4F5;
  --amber:#B76E00;--amber-l:#FFF3DC;
  --ok:#12805C;--ok-l:#E3F5EC;--err:#C0362C;--err-l:#FCE9E7;--warn:#B76E00;--warn-l:#FFF3DC;--info:#2457E6;--info-l:#E8EEFD;
  --bg:#F4F6FB;--surface:#fff;--line:#E4E8F1;--line2:#D3D9E6;
  --text:#101828;--mute:#5B6678;--faint:#8A94A6;
  --r:14px;--r-sm:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);--sh-lg:0 18px 50px rgba(12,26,54,.22);
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --side:262px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 14.5px/1.55 var(--f);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"tnum" 1}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.015em;line-height:1.25}
h1{font-size:26px;font-weight:800;letter-spacing:-.025em}h2{font-size:18px}h3{font-size:15.5px}h4{font-size:14px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
.mut{color:var(--mute)}.faint{color:var(--faint)}.xs{font-size:12px}.sm{font-size:13px}.b{font-weight:700}.sb{font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.sp{flex:1}.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:14px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g32{grid-template-columns:1.6fr 1fr}.g23{grid-template-columns:1fr 1.6fr}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}svg.i.lg{width:22px;height:22px}

/* ===== shell ===== */
#app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
#sb{background:linear-gradient(180deg,var(--ink) 0%,var(--ink2) 100%);color:#C9D3EA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;cursor:pointer}
.brand .mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4F7BFF,#16B3BD);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.04em;box-shadow:0 6px 16px rgba(36,87,230,.45)}
.brand b{display:block;color:#fff;font-size:15.5px;letter-spacing:-.01em}.brand span{font-size:11px;color:#8FA0C4;letter-spacing:.02em}
.navh{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6F82AA;padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:transparent;border-radius:10px;color:#C9D3EA;text-align:start;font-weight:500;font-size:13.5px;transition:background .15s,color .15s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:rgba(79,123,255,.2);color:#fff;box-shadow:inset 3px 0 0 #6D93FF}
.nav .ct{margin-inline-start:auto;background:#E5484D;color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:1px 7px}
.sbfoot{margin-top:auto;padding:16px 10px 2px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#8FA0C4;line-height:1.6}
#main{min-width:0;display:flex;flex-direction:column}
#tb{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 28px;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.tbt{min-width:0}.tbt .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbt .s{font-size:12px;color:var(--mute)}
.pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:99px;padding:5px 12px 5px 10px;font-size:13px}
.pill select{border:0;background:transparent;font:600 13px var(--f);color:var(--text);outline:0;max-width:210px;cursor:pointer}
.ib{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--line2);background:#fff;transition:background .15s,border-color .15s}
.ib:hover{background:var(--brand-l);border-color:#C5D3FA}
.ib .dot{position:absolute;top:-5px;inset-inline-end:-5px;background:#E5484D;color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.only-m{display:none}
#simbar{background:linear-gradient(90deg,#FFF6E0,#FFF9EC);border-bottom:1px solid #F5E2B4;color:#7A5200;font-size:12px;padding:7px 28px;display:flex;gap:8px;align-items:center}
#simbar b{letter-spacing:.06em;font-size:10.5px;background:#F2C14E;color:#4A3200;padding:2px 8px;border-radius:99px}
#stage{padding:26px 28px 60px;max-width:1380px;width:100%;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph .tx{flex:1;min-width:240px}.ph p{color:var(--mute);margin-top:5px;max-width:760px}
.crumb{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.02em;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--brand);font-weight:600}

/* ===== components ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card>.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.card>.ch h3{flex:1}
.card.flat{box-shadow:none}.card.tight{padding:14px}.card.hl{border-color:#C5D3FA;background:linear-gradient(180deg,#F7F9FF,#fff)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:#fff;color:var(--text);border-radius:10px;padding:8px 15px;font-weight:600;font-size:13.5px;transition:all .15s;white-space:nowrap}
.btn:hover{background:#F5F7FC;border-color:#B9C4DD}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(36,87,230,.28)}.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{filter:brightness(.93)}
.btn.dng{background:#fff;color:var(--err);border-color:#F1C4C0}.btn.dng:hover{background:var(--err-l)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}.btn.ghost:hover{background:var(--brand-l)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}
:focus-visible{outline:2.5px solid #7FA2FF;outline-offset:2px;border-radius:8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2.5px 9px;border-radius:99px;background:#EEF1F7;color:#445066;white-space:nowrap}
.badge.ok{background:var(--ok-l);color:var(--ok)}.badge.warn{background:var(--warn-l);color:var(--warn)}.badge.err{background:var(--err-l);color:var(--err)}.badge.info{background:var(--info-l);color:var(--brand)}.badge.teal{background:var(--teal-l);color:var(--teal)}
.badge.cq{background:#F3ECFF;color:#6B3FC4;cursor:help}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mute);font-weight:600}.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1}.kpi .d{font-size:12px;margin-top:5px;color:var(--mute)}
.kpi .d.up{color:var(--ok);font-weight:600}.kpi .d.dn{color:var(--err);font-weight:600}
.kpi .ic{position:absolute;inset-inline-end:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand)}
.kpi.t .ic{background:var(--teal-l);color:var(--teal)}.kpi.a .ic{background:var(--amber-l);color:var(--amber)}.kpi.g .ic{background:var(--ok-l);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#FAFBFE;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #EEF1F7;vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr{transition:background .12s}tbody tr:hover{background:#F8FAFF}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.tw table{min-width:640px}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}.who b{display:block;line-height:1.2}.who span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mute);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}.tabs button.on{color:var(--brand);border-color:var(--brand)}
.seg{display:inline-flex;background:#EBEEF6;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;padding:5px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--mute)}.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.prog{height:8px;background:#E9EDF6;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3B6CF0,#16B3BD);transition:width .4s}
.prog.warn i{background:linear-gradient(90deg,#F2A93B,#E0791B)}.prog.err i{background:#E5484D}.prog.ok i{background:#22A06B}
.inp,.sel,.txa{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font:500 14px var(--f);color:var(--text);background:#fff;transition:border-color .15s,box-shadow .15s}
.inp:focus,.sel:focus,.txa:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,87,230,.15)}
.txa{min-height:84px;resize:vertical}.sel{padding-inline-end:28px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fld label{font-size:12.5px;font-weight:700;color:#344054}.fld .h{font-size:12px;color:var(--mute)}.fld .er{font-size:12px;color:var(--err);font-weight:600}
.srch{position:relative;min-width:220px}.srch svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--faint)}.srch .inp{padding-inline-start:36px}
.banner{display:flex;gap:11px;padding:12px 15px;border-radius:12px;font-size:13px;border:1px solid;align-items:flex-start;line-height:1.5}
.banner.info{background:var(--info-l);border-color:#CBD8FA;color:#1A3F9E}.banner.warn{background:var(--warn-l);border-color:#F4DDA6;color:#7A4B00}.banner.ok{background:var(--ok-l);border-color:#BFE6D2;color:#0C5F43}.banner.err{background:var(--err-l);border-color:#F3C6C2;color:#8F2018}.banner.cq{background:#F6F0FF;border-color:#DDCCF7;color:#4F2F99}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.list{display:flex;flex-direction:column}.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #EEF1F7}.li:last-child{border-bottom:0}
.tl{position:relative;padding-inline-start:26px}.tl:before{content:"";position:absolute;inset-inline-start:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:0 0 16px}.tl .st:before{content:"";position:absolute;inset-inline-start:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--line2)}
.tl .st.done:before{background:var(--ok);border-color:var(--ok)}.tl .st.now:before{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(36,87,230,.18)}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--mute);transition:all .15s}.chip:hover{border-color:#9DB3F5;color:var(--brand)}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rate{display:flex;gap:6px}.rate button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-weight:700;color:var(--mute);transition:all .12s}.rate button:hover{border-color:var(--brand);color:var(--brand)}.rate button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.yn{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}.yn button{border:0;background:#fff;padding:5px 16px;font-weight:700;font-size:12.5px;color:var(--mute)}.yn button.y.on{background:var(--ok);color:#fff}.yn button.n.on{background:var(--err);color:#fff}
.hero{background:linear-gradient(120deg,var(--ink) 0%,var(--ink3) 60%,#1E56C8 100%);color:#fff;border-radius:18px;padding:26px 28px;position:relative;overflow:hidden;box-shadow:var(--sh-lg)}
.hero:after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(86,214,224,.35),transparent 65%)}
.hero h1{color:#fff}.hero p{color:#C7D4F2;margin-top:6px;max-width:620px}.hero .row{position:relative;z-index:1}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}.hero .btn:hover{background:rgba(255,255,255,.2)}.hero .btn.pri{background:#fff;color:var(--ink);border-color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{font-size:11px;font-weight:700;color:var(--faint);text-align:center;text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:#fff;font-size:11.5px}.cal .d.o{background:#FAFBFE;color:var(--faint)}.cal .d.t{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal .ev{display:block;margin-top:3px;padding:2px 6px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--brand-l);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;width:100%;text-align:start}
.cal .ev.done{background:var(--ok-l);color:var(--ok)}.cal .ev.can{background:var(--err-l);color:var(--err);text-decoration:line-through}.cal .ev.open{background:var(--teal-l);color:var(--teal)}
.chat{display:flex;flex-direction:column;gap:12px;max-height:440px;overflow:auto;padding:4px 2px 8px}
.msg{max-width:84%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.55}.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-end-end-radius:4px}.msg.a{align-self:flex-start;background:#F1F4FB;border:1px solid var(--line);border-end-start-radius:4px}
.src{display:inline-flex;align-items:center;gap:5px;margin:8px 6px 0 0;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:600;color:var(--teal)}
.cert{border:3px double #B9A15C;border-radius:14px;padding:30px;text-align:center;background:linear-gradient(180deg,#FFFEF9,#FBF6E6);position:relative}
.cert h2{font-size:26px;letter-spacing:.04em;color:#6B5513}.cert .nm{font-size:30px;font-weight:800;margin:10px 0;color:var(--ink)}
/* modal & drawer */
#ov{position:fixed;inset:0;background:rgba(12,26,54,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow:auto}
#ov.on{display:flex;animation:fade .18s}
.modal{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:640px;display:flex;flex-direction:column}
.modal.wide{max-width:860px}.modal>.mh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}.modal>.mh h2{flex:1}
.modal>.mb2{padding:20px 22px;max-height:64vh;overflow:auto}.modal>.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#FAFBFE;border-radius:0 0 18px 18px}
#dr{position:fixed;top:0;inset-inline-end:0;bottom:0;width:min(440px,100vw);background:#fff;box-shadow:var(--sh-lg);transform:translateX(105%);transition:transform .25s;z-index:110;display:flex;flex-direction:column}
[dir=rtl] #dr{transform:translateX(-105%)}#dr.on{transform:none}
#dr>.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}#dr>.mh h2{flex:1}#dr>.bd{padding:16px 20px;overflow:auto;flex:1}
#scrim{position:fixed;inset:0;background:rgba(12,26,54,.35);z-index:105;display:none}#scrim.on{display:block}
#toasts{position:fixed;bottom:20px;inset-inline-end:20px;display:flex;flex-direction:column;gap:9px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--sh-lg);max-width:380px;animation:fade .2s;display:flex;gap:10px;align-items:flex-start}
.toast.ok{background:#0B5E43}.toast.err{background:#9A261D}
.bld{display:none;position:fixed;bottom:8px;inset-inline-start:10px;font:10.5px monospace;opacity:.45;z-index:9999;pointer-events:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g32,.g23{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
  #app{grid-template-columns:1fr}
  #sb{position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:90;transform:translateX(-105%);transition:transform .22s}
  body.sbopen #sb{transform:none;box-shadow:var(--sh-lg)}
  body.sbopen #scrim{display:block;z-index:85}
  .only-m{display:grid}#tb{padding:10px 16px;flex-wrap:wrap}#stage{padding:18px 16px 60px}#simbar{padding:7px 16px}.hide-m{display:none!important}
}
@media (min-width:981px){body.sbhide #app{grid-template-columns:1fr}body.sbhide #sb{display:none}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}.kpi .v{font-size:24px}h1{font-size:22px}.cal .d{min-height:54px}.cal .ev{font-size:0;height:6px;padding:0}.hero{padding:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{#sb,#tb,#simbar,.bld{display:none}#app{display:block}}
</style>
</head>

'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const _rt=new Date(),TODAY=new Date(_rt.getFullYear(),_rt.getMonth(),_rt.getDate()),SHIFT=Math.round((TODAY-new Date(2026,10,17))/864e5);
const isoTom=()=>{const t=new Date(TODAY);t.setDate(t.getDate()+1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const dt=(y,m,d)=>{const x=new Date(y,m-1,d);x.setDate(x.getDate()+SHIFT);return x};
const fd=d=>{d=new Date(d);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const fdw=d=>{d=new Date(d);return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]};
const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const daysTo=d=>Math.round((new Date(d).setHours(0,0,0,0)-TODAY.getTime())/864e5);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const inrK=n=>n>=1e5?'₹'+(n/1e5).toFixed(2).replace(/\.?0+$/,'')+' L':'₹'+Math.round(n).toLocaleString('en-IN');
const pct=(a,b)=>b?Math.round(a*100/b):0;
const sum=a=>a.reduce((x,y)=>x+(+y||0),0), avg=a=>a.length?sum(a)/a.length:0;

function barChart(labels,sa,sb,o={}){ // grouped bars: planned vs executed
  const W=560,H=210,pl=34,pb=26,pt=10,n=labels.length,gw=(W-pl)/n,mx=Math.max(1,...sa,...sb);const step=Math.ceil(mx/4);const top=step*4;
  let g='';for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E4E8F1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#8A94A6">${step*i}</text>`}
  labels.forEach((l,i)=>{const x=pl+gw*i+gw*.16,bw=gw*.31,h1=(H-pt-pb)*sa[i]/top,h2=(H-pt-pb)*sb[i]/top;
    g+=`<rect x="${x}" y="${H-pb-h1}" width="${bw}" height="${h1}" rx="4" fill="#C9D6F7"><title>${l}: planned ${sa[i]}</title></rect><rect x="${x+bw+3}" y="${H-pb-h2}" width="${bw}" height="${h2}" rx="4" fill="#2457E6"><title>${l}: executed ${sb[i]}</title></rect><text x="${pl+gw*i+gw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#5B6678">${l}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'Planned versus executed trainings')}">${g}</svg><div class="row xs mut" style="gap:16px;margin-top:6px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#C9D6F7"></i> Planned</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#2457E6"></i> Executed</span></div>`}
function donut(parts,o={}){ // [{l,v,c}]
  const tot=sum(parts.map(p=>p.v))||1,R=52,C=2*Math.PI*R;let off=0,seg='';
  parts.forEach(p=>{const len=C*p.v/tot;seg+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(p.l)}: ${esc(o.fmt?o.fmt(p.v):p.v)}</title></circle>`;off+=len});
  return`<div class="row" style="gap:18px;align-items:center"><svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="${esc(o.label||'Distribution')}">${seg}<text x="70" y="66" text-anchor="middle" font-size="11" fill="#5B6678">${esc(o.cl||'Total')}</text><text x="70" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#101828">${esc(o.ct||'')}</text></svg><div class="col" style="gap:6px;flex:1;min-width:150px">${parts.map(p=>`<div class="row sm" style="gap:8px;justify-content:space-between"><span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${p.c};display:inline-block"></i>${esc(p.l)}</span><b>${esc(o.fmt?o.fmt(p.v):p.v)}</b></div>`).join('')}</div></div>`}
function spark(vals,color='#2457E6'){const W=90,H=26,mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||1;const pts=vals.map((v,i)=>`${(i*(W/(vals.length-1))).toFixed(1)},${(H-3-(v-mn)/rg*(H-6)).toFixed(1)}`).join(' ');return`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

const canNominate=(e,b)=>{const p=PG(b.prog);
 if(b.status!=='Open for nomination')return{ok:false,why:'Nominations are not open for this batch.'};

 const attended=D.batches.some(x=>x.prog===b.prog&&attOf(x.id,e.id)==='P');
 if(attended){const rt=D.retrain.find(t=>t.emp===e.id&&t.prog===b.prog&&t.status==='Approved'&&!t.used);if(!rt)return{ok:false,why:'You have already attended '+p.title+'. Re-nomination needs an approved retraining recommendation.'}}
 if(bStats(b).active>=D.rules.nomCap)return{ok:false,why:'This batch has reached its limit of '+D.rules.nomCap+' nominations. Please choose another date.'};
 return{ok:true}};

/* reporting periods (calendar quarter = Indian FY quarter; FY assumed Apr–Mar) */
function periodRange(k){const y=TODAY.getFullYear(),m=TODAY.getMonth();
 if(k==='q'){const q=Math.floor(m/3),fyq=((q+3)%4)+1;const fy=m>=3?y:y-1;return{a:new Date(y,q*3,1),b:new Date(y,q*3+3,0,23,59),label:'Q'+fyq+' FY '+fy+'-'+String(fy+1).slice(2)+' ('+MON[q*3]+'–'+MON[q*3+2]+' '+y+')'}}
 if(k==='fy'){const fy=m>=3?y:y-1;return{a:new Date(fy,3,1),b:new Date(fy+1,2,31,23,59),label:'FY '+fy+'-'+String(fy+1).slice(2)+' (Apr–Mar, to be confirmed)'}}
 if(k==='cy'){return{a:new Date(y,0,1),b:new Date(y,11,31,23,59),label:'Calendar year '+y}}
 return null}
const inRange=(d,r)=>!r||(d>=r.a&&d<=r.b);
const inPer=d=>inRange(d,periodRange(S.p&&S.p.per));
function audit(act,obj){D.audit.unshift({at:TODAY,who:meE()?meE().n:(TR(me())||{}).n||'System',act,obj})}
function calcCost(inp,days,n){const r=D.rules;const trainer=(inp.trainerDay||0)*days,tax=trainer*r.taxTrainer/100,food=(inp.foodPP||0)*n*days,room=(inp.roomPP||0)*n*days*(1+r.taxRoom/100);
  const v={trainer,tax,travel:inp.travel||0,accom:inp.accom||0,stationery:inp.stationery||0,food,room,equip:inp.equip||0,other:inp.other||0};v.total=sum(HEADS.map(h=>v[h.k]));v.per=n?v.total/n:0;return v}
function batchCost(bid,which){const b=BT(bid),c=D.costs[bid];const inp=which==='act'?c.act:c.plan;if(!inp)return null;const n=costHead(b,which);return calcCost(inp,PG(b.prog).dur,n)}
const presentCount=b=>nomsOf(b.id).filter(n=>n.status==='Confirmed'&&attOf(b.id,n.emp)==='P').length;
function costHead(b,which){const conf=bStats(b).confirmed;if(which==='act'){const p=presentCount(b);return p||conf||D.rules.confCap}return conf||D.rules.confCap}
function costStatus(b){const c=D.costs[b.id];return c&&c.recon?'Reconciled':c&&c.act?'Actuals entered':['Confirmed','In progress','Completed'].includes(b.status)?'Committed':'Budgeted'}
const share=bid=>{if(S.ent==='All')return 1;const ns=nomsOf(bid).filter(n=>n.status==='Confirmed');return ns.length?ns.filter(n=>E(n.emp).entity===S.ent).length/ns.length:0};
const effOf=empId=>{const s=D.imp.filter(i=>i.emp===empId&&i.status==='Submitted').map(i=>i.score);return s.length?r1(avg(s)):null};
const fbAvg=f=>r1(avg([...f.trainer,...f.content,f.env,f.overall]));
const trainerRating=tid=>{const fs=D.fb.filter(f=>BT(f.batch).trainer===tid);return fs.length?{avg:r1(avg(fs.map(f=>avg([...f.trainer,f.overall])))),n:fs.length}:{avg:null,n:0}};
const progBatches=pid=>D.batches.filter(b=>b.prog===pid);
function certElig(b,empId){const a=attOf(b.id,empId)==='P',as=D.asm.find(x=>x.batch===b.id&&x.emp===empId),pass=as&&as.post!=null&&as.post>=D.rules.passScore,fb=D.fb.some(f=>f.batch===b.id&&f.emp===empId),has=D.certs.find(c=>c.batch===b.id&&c.emp===empId);return{att:a,pass:!!pass,post:as?as.post:null,fb,has,ok:a&&pass&&fb}}
function metrics(){ // entity-filtered
  const done=D.batches.filter(b=>['Completed','In progress'].includes(b.status));
  let present=0,absent=0;const trained=new Set();let mandays=0;
  done.forEach(b=>{const m=D.att[b.id]||{};Object.keys(m).forEach(e=>{if(!entOK(e))return;if(m[e]==='P'){present++;trained.add(e);mandays+=PG(b.prog).dur}else if(m[e]==='A')absent++})});
  const imps=D.imp.filter(i=>i.status==='Submitted'&&entOK(i.emp));
  const spend=sum(D.batches.filter(isDone).map(b=>{const c=batchCost(b.id,'act');return c?c.total*share(b.id):0}));
  return{executed:done.length,planned:D.batches.filter(b=>b.status!=='Cancelled').length,trained:trained.size,present,absent,noShow:pct(absent,present+absent),mandays,manhours:mandays*8,eff:imps.length?r1(avg(imps.map(i=>i.score))):null,spend,perPart:trained.size?spend/trained.size:0}}
const HIST={Jun:[3,3],Jul:[4,3],Aug:[3,3],Sep:[4,4]}; // illustrative earlier months
function monthSeries(){const labs=[],pl=[],ex=[];const samp=[[3,3],[4,3],[3,3],[4,4]];for(let k=-5;k<=1;k++){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+k,1);labs.push(MON[d.getMonth()]);if(k<=-2){pl.push(samp[k+5][0]);ex.push(samp[k+5][1]);continue}const bs=D.batches.filter(b=>b.date.getMonth()===d.getMonth()&&b.date.getFullYear()===d.getFullYear()&&b.status!=='Cancelled'&&(S.ent==='All'||b.pool.includes(S.ent)));pl.push(bs.length);ex.push(bs.filter(b=>['Completed','In progress'].includes(b.status)).length)}return{labs,pl,ex}}
function spendByHead(){const t={};HEADS.forEach(h=>t[h.k]=0);D.batches.filter(isDone).forEach(b=>{const c=batchCost(b.id,'act');if(!c)return;HEADS.forEach(h=>t[h.k]+=c[h.k]*share(b.id))});return t}
function empRecords(empId){const rows=[];D.noms.filter(n=>n.emp===empId&&n.status==='Confirmed').forEach(n=>{const b=BT(n.batch),a=D.asm.find(x=>x.batch===b.id&&x.emp===empId),c=D.certs.find(x=>x.batch===b.id&&x.emp===empId),im=D.imp.find(x=>x.batch===b.id&&x.emp===empId);rows.push({b,att:attOf(b.id,empId),post:a?a.post:null,cert:c,eff:im&&im.status==='Submitted'?im.score:null})});return rows.sort((x,y)=>y.b.date-x.b.date)}

    D.emps.filter(e=>entOK(e.id)&&e.dept!=='Management').forEach(e=>{const rec=empRecords(e.id).filter(r=>r.att==='P');R.push([e.id,e.n,e.entity,e.dept,e.desig,'L'+e.level,e.loc,rec.length,effOf(e.id)||'—'])})}
  if(kind==='cal'){H.push('Programme','Batch','Date','Company pool','Venue','Trainer','Planned','Executed');D.batches.filter(b=>(S.ent==='All'||b.pool.includes(S.ent))&&inPer(b.date)).forEach(b=>R.push([bName(b),b.id,fd(b.date),b.pool.join('/'),b.venue,TR(b.trainer).n,'Yes',['Completed','In progress'].includes(b.status)?'Yes':b.status==='Cancelled'?'Cancelled':'Pending']))}
  if(kind==='mandays'){H.push('Programme','Batch','Participants present','Days','Mandays','Manhours (8h)');D.batches.filter(b=>['Completed','In progress'].includes(b.status)&&inPer(b.date)).forEach(b=>{const m=D.att[b.id]||{};const p=Object.keys(m).filter(e=>m[e]==='P'&&entOK(e)).length;const d=PG(b.prog).dur;R.push([bName(b),b.id,p,d,p*d,p*d*8])})}
  if(kind==='indiv'){H.push('Employee','Programme','Batch','Attendance','Post-assessment','Cost per participant','Effectiveness');D.noms.filter(n=>n.status==='Confirmed'&&['Completed','In progress'].includes(BT(n.batch).status)&&entOK(n.emp)&&inPer(BT(n.batch).date)).forEach(n=>{const b=BT(n.batch),a=D.asm.find(x=>x.batch===b.id&&x.emp===n.emp),im=D.imp.find(x=>x.batch===b.id&&x.emp===n.emp),c=batchCost(b.id,b.status==='Completed'?'act':'plan');R.push([E(n.emp).n,bName(b),b.id,attOf(b.id,n.emp)==='P'?'Present':attOf(b.id,n.emp)==='A'?'Absent':'Not marked',a&&a.post!=null?a.post+'%':'—',c&&S.role!=='hod'?inr(c.per):'—',im&&im.status==='Submitted'?im.score:'—'])})}
  if(kind==='att'){H.push('Programme','Batch','Company','Present','Absent / no-show','Not marked');D.batches.filter(b=>['Completed','In progress'].includes(b.status)&&inPer(b.date)).forEach(b=>ENT.filter(e=>S.ent==='All'||e===S.ent).forEach(en=>{const ns=nomsOf(b.id).filter(n=>n.status==='Confirmed'&&E(n.emp).entity===en);if(!ns.length)return;const m=D.att[b.id]||{};R.push([bName(b),b.id,en,ns.filter(n=>m[n.emp]==='P').length,ns.filter(n=>m[n.emp]==='A').length,ns.filter(n=>!m[n.emp]).length])}))}
  if(kind==='trainer'){H.push('Trainer','Programmes delivered','Responses','Avg rating (1–5)','Training hours','Total cost');D.trainers.forEach(t=>{const bs=D.batches.filter(b=>b.trainer===t.id&&isDone(b)&&inPer(b.date)),rt=trainerRating(t.id);R.push([t.n,bs.length,rt.n,rt.avg||'—',sum(bs.map(b=>PG(b.prog).dur*6)),inr(sum(bs.map(b=>{const c=batchCost(b.id,'act');return c?c.trainer+c.tax:0})))])})}
  return{H,R}}

function costTable(b,editable){const c=D.costs[b.id],p=PG(b.prog),n=costHead(b,'plan'),na=costHead(b,'act'),locked=!!c.recon;editable=editable&&!locked;const pl=calcCost(c.plan,p.dur,n),ac=c.act?calcCost(c.act,p.dur,na):null;const cs=costStatus(b);

 const cell=(which,h,v)=>{const key=f[h.k];if(editable&&which==='act'&&key)return`<input class="inp" style="width:110px;text-align:end;padding:6px 9px" type="number" min="0" value="${c.act?c.act[key]:0}" data-chg="cost" data-b="${b.id}" data-k="${key}" aria-label="Actual ${esc(h.n)}">`;return inr(v)};
 return`<div class="row mb">${['Budgeted','Committed','Actuals entered','Reconciled'].map(x=>badge(x,x===cs?'ok':'')).join('<span class="faint">›</span>')}<span class="sp"></span>${c.act&&!locked&&isDone(b)?btn('Mark reconciled','reconcile',{id:b.id},{sm:true,k:'pri'}):''}${locked?`<span class="xs mut">Reconciled to invoices ${esc(c.recon.ref)} · ${fd(c.recon.at)}</span>${btn('Reopen','reopencost',{id:b.id},{sm:true})}`:''}</div><div class="tw"><table><thead><tr><th>Cost head</th><th>Basis</th><th style="text-align:end">Planned</th><th style="text-align:end">Actual</th><th style="text-align:end">Variance</th></tr></thead><tbody>${HEADS.map(h=>{const pv=pl[h.k],av=ac?ac[h.k]:null;return`<tr><td><b>${h.n}</b></td><td class="xs mut">${h.basis}</td><td style="text-align:end">${inr(pv)}</td><td style="text-align:end">${ac?cell('act',h,av):'—'}</td><td style="text-align:end;color:${ac&&av>pv?'var(--err)':'var(--ok)'}">${ac?(av-pv>=0?'+':'')+inr(av-pv):'—'}</td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="2"><b>Total</b> · planned for ${n} confirmed${ac?` · actual for ${na} attended`:''}</td><td style="text-align:end"><b>${inr(pl.total)}</b></td><td style="text-align:end"><b>${ac?inr(ac.total):'—'}</b></td><td style="text-align:end"><b>${ac?(ac.total-pl.total>=0?'+':'')+inr(ac.total-pl.total):'—'}</b></td></tr><tr><td colspan="2"><b>Cost per participant</b> <span class="xs mut">(÷ confirmed / ÷ attended)</span></td><td style="text-align:end"><b>${inr(pl.per)}</b></td><td style="text-align:end"><b>${ac?inr(ac.per):'—'}</b></td><td></td></tr></tfoot></table></div><p class="xs mut mt">Total = trainer fee + tax (${D.rules.taxTrainer}%) + travel + accommodation + stationery + food + conference room (+${D.rules.taxRoom}% tax) + equipment + other. Participant-based heads (food, room) use confirmed headcount in the plan and actual attendance in the actual column. Tax rates are configurable ${cq('CQ-15')}. Actual figures are entered by HR / L&D from invoices and marked reconciled once checked.</p>`}

ACT.openbatch=el=>{S.role==='admin'||(S.role='admin');S.view='batches';S.p={id:el.dataset.id};S.tab.batch='noms';render();window.scrollTo(0,0)};
ACT.newbatch=el=>{const pre=el.dataset.prog||'P26';const pubs=D.progs.filter(p=>p.status==='Published');modal({title:'Create batch',body:`<div class="grid g2">${fld('Programme',sel('nb_p',pubs.map(p=>[p.id,p.title]),pre),{id:'nb_p'})}${fld('Trainer',sel('nb_tr',D.trainers.map(t=>[t.id,t.n]),PG(pre).trainer),{id:'nb_tr'})}${fld('Date',`<input class="inp" id="nb_d" type="date" min="${isoTom()}">`,{id:'nb_d'})}${fld('Start time',`<input class="inp" id="nb_t" type="time" value="10:00">`,{id:'nb_t'})}${fld('Venue',`<input class="inp" id="nb_v" placeholder="e.g. Mumbai · Training Hub">`,{id:'nb_v'})}${fld('Mode',sel('nb_m',['Offline','Online','Hybrid'],'Offline'),{id:'nb_m'})}</div>`+fld('Eligible companies',`<div class="row">${checks('nb_e',ENT.map(e=>[e,e]),ENT)}</div>`,{id:'nb_e'}),ok:'Create batch',fn:()=>{const d=val('nb_d'),v=val('nb_v'),pool=checked('nb_e');let bad=false;
  if(!d||new Date(d)<=TODAY){setErr('nb_d','Pick a future date');bad=true}else setErr('nb_d','');
  if(v.length<3){setErr('nb_v','Enter the venue');bad=true}else setErr('nb_v','');
  if(!pool.length){setErr('nb_e','Select at least one company');bad=true}else setErr('nb_e','');if(bad)return false;
  const p=PG(val('nb_p')),n=progBatches(p.id).length+1;const id='B-'+p.no+'-'+String(n).padStart(2,'0');const [y,m,dd]=d.split('-').map(Number);
  const b={id,prog:p.id,date:new Date(y,m-1,dd),time:val('nb_t')||'10:00',status:'Planned',pool,venue:v,mode:val('nb_m'),trainer:val('nb_tr')};D.batches.push(b);D.batchById[id]=b;newCost(id);audit('Created batch '+id,'Batch');toast('Batch '+id+' created','ok');S.view='batches';S.p={id};S.tab.batch='noms';render()}})};
ACT.opennoms=el=>{const b=BT(el.dataset.id);if(b.status!=='Planned'){toast('Nominations are already '+(b.status==='Open for nomination'?'open':'closed')+' for this batch','err');return}b.status='Open for nomination';const ids=D.emps.filter(e=>eligible(e,b)&&e.dept!=='Management').map(e=>e.id);const n=notify(ids,'Invitation','You are invited: '+bName(b),'You are eligible for '+bName(b)+' on '+fd(b.date)+'. Choose a date and self-nominate.',{extra:b.id});audit('Opened nominations for '+b.id,'Batch');toast(`Nominations open · ${n} invitation notifications generated (demo – no emails are delivered)`,'ok');render()};
ACT.closenoms=el=>{const b=BT(el.dataset.id),pend=nomsOf(b.id).filter(n=>n.status==='Pending HOD'),s=bStats(b);if(b.status!=='Open for nomination')return;
 modal({title:'Close nominations',body:`<p><b>${s.confirmed}</b> confirmed · <b>${s.wait}</b> waitlisted · <b>${pend.length}</b> still awaiting HOD approval.</p>${pend.length?`<div class="banner warn mt">Nominations without HOD approval at closure <b>lapse</b>. The employee and the HOD are notified and the employee can nominate for another date. Reminding the HODs first is usually better.</div>`:''}<p class="sm mut mt">Handling of pending approvals is configurable. ${cq('CQ-08')}</p>`,ok:pend.length?`Close and lapse ${pend.length} pending`:'Close nominations',fn:()=>{pend.forEach(n=>{n.status='Cancelled';n.comment='Lapsed: HOD approval not received before nominations closed';notify([n.emp,E(n.emp).mgr],'Lapsed','Nomination lapsed: '+bName(b),'HOD approval was not received before nominations closed for '+fd(b.date)+'.')});b.status='Confirmed';audit('Closed nominations for '+b.id+(pend.length?' ('+pend.length+' lapsed)':''),'Batch');toast('Nominations closed – roster confirmed'+(pend.length?' · '+pend.length+' pending nominations lapsed':''),'ok');render()}})};
ACT.sendrem=el=>{const b=BT(el.dataset.id),ns=nomsOf(b.id).filter(n=>n.status==='Confirmed');if(!ns.length){toast('No confirmed participants to remind yet','err');return}const n=notify(ns.map(x=>x.emp),'Reminder','Reminder: '+bName(b)+' on '+fd(b.date),'This is a reminder that your training is on '+fdw(b.date)+' at '+b.time+', '+b.venue+'.',{extra:b.id});audit('Generated reminders for '+b.id,'Notification');toast(`${n} reminder notifications generated – demo only, no email delivered. See Communication log.`,'ok')};
ACT.cancelbatch=el=>{const b=BT(el.dataset.id);if(b.status==='Cancelled')return;modal({title:'Cancel batch '+b.id,body:`<p class="sm mb">All participants and their HODs will receive a notification.</p>${fld('Reason',`<textarea class="txa" id="cb_r"></textarea>`,{id:'cb_r'})}`,ok:'Cancel batch',okk:'dng',cancelLabel:'Keep batch',fn:()=>{const r=val('cb_r');if(r.length<5){setErr('cb_r','Please give a reason (5+ characters)');return false}const act=D.noms.filter(n=>n.batch===b.id&&['Pending HOD','Confirmed','Waitlisted'].includes(n.status));act.forEach(n=>{n.status='Cancelled';n.comment='Batch cancelled: '+r});const cnt=notify(act.flatMap(n=>[n.emp,E(n.emp).mgr]),'Cancellation','Batch cancelled: '+bName(b),r,{extra:b.id});b.status='Cancelled';b.cancelReason=r;audit('Cancelled batch '+b.id,'Batch');toast(`Batch cancelled · ${act.length} nominations closed · ${cnt} notifications generated (demo – not emailed)`,'ok');render()}})};
function promoteNext(b){const q=waitQueue(b);if(!q.length||bStats(b).confirmed>=D.rules.confCap)return null;const n=q[0];n.status='Confirmed';notify([n.emp,E(n.emp).mgr],'Confirmed','A seat opened – confirmed: '+bName(b),E(n.emp).n+' is now confirmed for '+bName(b)+' on '+fd(b.date)+'.');audit('Promoted waitlisted nominee '+n.emp,'Nomination');return n}
ACT.promote=el=>{const n=D.noms.find(x=>x.id===el.dataset.id);if(!n||n.status!=='Waitlisted')return;const b=BT(n.batch);if(bStats(b).confirmed>=D.rules.confCap){toast(`Batch already has ${D.rules.confCap} confirmed. A seat must be released first.`,'err');return}const head=waitQueue(b)[0];if(head!==n){toast('Seats are offered in waitlist order – '+E(head.emp).n+' is first in the queue.','err');return}promoteNext(b);toast(E(n.emp).n+' promoted to the confirmed roster','ok');render()};
ACT.cancelnom=el=>{const n=D.noms.find(x=>x.id===el.dataset.id);if(!n||!['Pending HOD','Confirmed','Waitlisted'].includes(n.status))return;modal({title:'Cancel participant',body:`<p class="sm mb">${esc(E(n.emp).n)} · ${esc(bName(BT(n.batch)))}</p>${fld('Reason',`<textarea class="txa" id="cn_r"></textarea>`,{id:'cn_r'})}`,ok:'Cancel participant',okk:'dng',fn:()=>{const r=val('cn_r');if(r.length<5){setErr('cn_r','Please record a reason (5+ characters)');return false}const was=n.status;n.status='Cancelled';n.comment=r;notify([n.emp],'Cancellation','Your participation was cancelled',r);audit('Cancelled participant '+n.emp,'Nomination');const b=BT(n.batch);const pr=was==='Confirmed'?promoteNext(b):null;const s=bStats(b);toast(`Participant cancelled · ${s.confirmed}/${D.rules.confCap} confirmed`+(pr?` · ${E(pr.emp).n} moved up from the waitlist`:''),'ok');render()}})};

ACT.openatt=el=>{S.view='att';S.p={attb:el.dataset.id};render()};
ACT.mark=el=>{const b=el.dataset.b;if(D.attClosed[b])return;(D.att[b]=D.att[b]||{})[el.dataset.e]=el.dataset.v;render()};
ACT.markall=el=>{const b=el.dataset.id;const m=D.att[b]=D.att[b]||{};nomsOf(b).filter(n=>n.status==='Confirmed').forEach(n=>m[n.emp]='P');render()};
ACT.closeatt=el=>{const b=BT(el.dataset.id),m=D.att[b.id]=D.att[b.id]||{};if(D.attClosed[b.id])return;const roster=nomsOf(b.id).filter(n=>n.status==='Confirmed');if(!roster.length)return;const unmarked=roster.filter(n=>!m[n.emp]),absent=roster.filter(n=>m[n.emp]==='A'),pres=roster.filter(n=>m[n.emp]==='P');
 modal({title:'Close attendance',body:`<p><b>${pres.length}</b> present · <b>${absent.length}</b> marked absent · <b>${unmarked.length}</b> not marked.</p>${unmarked.length?`<div class="banner warn mt">${unmarked.length} participant(s) have no attendance mark: ${unmarked.slice(0,6).map(n=>esc(E(n.emp).n)).join(', ')}${unmarked.length>6?'…':''}. Go back and mark them, or confirm below that they were absent.</div><label class="row sm mt" style="gap:8px"><input type="checkbox" id="ca_conf"> Record the ${unmarked.length} unmarked participant(s) as absent (no-show)</label><div class="er" id="er-ca_conf"></div>`:''}<p class="sm mut mt">In-app notifications are generated for the participant and their HOD (the VP – Corporate Affairs contact can be added as a recipient ${cq('CQ-10')}). E-mail delivery is not active in this demo. Attendance can be corrected afterwards, with a reason, from the same screen.</p>`,ok:'Close attendance',fn:()=>{if(unmarked.length&&!($('#ca_conf')||{}).checked){setErr('ca_conf','Tick the box to record unmarked participants as absent, or go back and mark them');return false}
  unmarked.forEach(n=>{m[n.emp]='A';D.attLog.unshift({b:b.id,e:n.emp,from:null,to:'A',by:meE()?meE().n:'System',at:TODAY,reason:'Not marked at closure – confirmed as absent'})});
  D.attClosed[b.id]=true;if(b.status==='In progress')b.status='Completed';
  pres.forEach(n=>{const e=E(n.emp),h=E(e.mgr);if(!h)return;if(!D.imp.some(i=>i.batch===b.id&&i.emp===e.id))D.imp.push({id:uid('IA'),batch:b.id,emp:e.id,eval:h.id,tpl:PG(b.prog).tpl,due:addD(b.date,D.rules.impactWeeks*7),status:'Pending',answers:null,remarks:'',signoff:null,score:null})});
  const ab=roster.filter(n=>m[n.emp]==='A');if(ab.length){const c=notify(ab.flatMap(n=>[n.emp,E(n.emp).mgr]),'No-show','No-show: '+bName(b)+' on '+fd(b.date),'Marked absent for '+bName(b)+'.',{extra:'Copy to VP – Corporate Affairs contact configurable'});note(ME.admin,'No-show','No-show summary – '+b.id,ab.length+' absent; '+c+' notifications generated.')}
  pres.forEach(n=>note(n.emp,'Feedback','Share your feedback: '+bName(b),'Your attendance is recorded. Please complete the feedback form.'));
  audit('Closed attendance for '+b.id+' ('+ab.length+' absent)','Attendance');toast(`Attendance closed · ${ab.length} no-show notification set(s) generated (demo – not emailed) · impact assessments scheduled`,'ok');render()}})};
ACT.fixatt=el=>{const b=BT(el.dataset.b),e=E(el.dataset.e),cur=(D.att[b.id]||{})[e.id];if(D.certs.some(c=>c.batch===b.id&&c.emp===e.id)){toast('A certificate has already been issued – revoke it before changing attendance.','err');return}
 modal({title:'Correct attendance',body:`<p class="sm mb">${esc(e.n)} · ${esc(bName(b))} · currently <b>${cur==='P'?'Present':cur==='A'?'Absent':'Not marked'}</b></p>${fld('Corrected status',sel('fa_v',[['P','Present'],['A','Absent']],cur==='P'?'A':'P'),{id:'fa_v'})}${fld('Reason (kept in the audit history)',`<textarea class="txa" id="fa_r"></textarea>`,{id:'fa_r'})}`,ok:'Save correction',fn:()=>{const v=val('fa_v'),r=val('fa_r');if(r.length<5){setErr('fa_r','Please give a reason (5+ characters)');return false}if(v===cur){setErr('fa_v','This is already the recorded status');return false}
  (D.att[b.id]=D.att[b.id]||{})[e.id]=v;D.attLog.unshift({b:b.id,e:e.id,from:cur||null,to:v,by:meE().n,at:TODAY,reason:r});
  if(v==='P'){const h=E(e.mgr);if(h&&!D.imp.some(i=>i.batch===b.id&&i.emp===e.id))D.imp.push({id:uid('IA'),batch:b.id,emp:e.id,eval:h.id,tpl:PG(b.prog).tpl,due:addD(b.date,D.rules.impactWeeks*7),status:'Pending',answers:null,remarks:'',signoff:null,score:null})}
  else D.imp=D.imp.filter(i=>!(i.batch===b.id&&i.emp===e.id&&i.status==='Pending'));
  notify([e.id,e.mgr],'Attendance','Attendance corrected: '+bName(b),'Status changed to '+(v==='P'?'Present':'Absent')+'. Reason: '+r);audit('Corrected attendance '+e.id+' → '+(v==='P'?'Present':'Absent')+' ('+r+')','Attendance');toast('Attendance corrected and logged','ok');render()}})};

ACT.addemp=()=>modal({wide:true,title:'Add employee',body:`<div class="grid g2">${fld('Employee code',`<input class="inp" id="ae_c" placeholder="e.g. BAA-2300">`,{id:'ae_c'})}${fld('Full name',`<input class="inp" id="ae_n">`,{id:'ae_n'})}${fld('Company',sel('ae_e',ENT,'BAA'),{id:'ae_e'})}${fld('Department',`<input class="inp" id="ae_d" placeholder="e.g. Sales">`,{id:'ae_d'})}${fld('Designation',`<input class="inp" id="ae_g">`,{id:'ae_g'})}${fld('Level',sel('ae_l',[[1,'L1'],[2,'L2'],[3,'L3'],[4,'L4']],2),{id:'ae_l'})}${fld('Location',`<input class="inp" id="ae_o">`,{id:'ae_o'})}${fld('Reporting manager',sel('ae_m',D.emps.filter(e=>e.level>=3).map(e=>[e.id,e.n+' · '+e.entity]),'BAA-1007'),{id:'ae_m'})}${fld('Email',`<input class="inp" id="ae_em" type="email">`,{id:'ae_em'})}</div>`,ok:'Add employee',fn:()=>{const c=val('ae_c').toUpperCase(),n=val('ae_n'),d=val('ae_d'),g=val('ae_g'),o=val('ae_o'),em=val('ae_em');let bad=false;

function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);return rows}

 if(!rem.length){setErr('r_rem','Enter at least one reminder day');return}if(g('r_rt')<1||g('r_rt')>5){setErr('r_rt','Enter a value between 1 and 5');return}if(g('r_pass')<1||g('r_pass')>100){setErr('r_pass','Enter 1–100');return}
 Object.assign(D.rules,{nomCap:g('r_nom'),confCap:g('r_conf'),reminders:rem.sort((a,b)=>b-a),retrainBelow:g('r_rt'),passScore:g('r_pass'),impactWeeks:g('r_wk')||8,taxTrainer:g('r_tt'),taxRoom:g('r_tr'),allowChampPart:$('#r_champ').checked,noShowCc:val('r_cc'),retakes:Math.max(0,Math.min(5,+val('r_retake')||0)),waitlist:val('r_wl')||'nom'});audit('Updated business rules','Configuration');toast('Business rules saved – applied to all workflows','ok');render()};
ACT.resetrules=()=>{Object.assign(D.rules,{nomCap:25,confCap:20,reminders:[7,5,3],retrainBelow:3,passScore:70,retakes:1,waitlist:'nom',impactWeeks:8,allowChampPart:false,taxTrainer:18,taxRoom:18,noShowCc:'Participant, HOD, VP – Corporate Affairs'});toast('Defaults restored','ok');render()};
ACT.testint=el=>{D.integTests[el.dataset.n]=TODAY;toast('Simulated check only – no live connection was made, so the integration status is unchanged');render()};
/* ---- AI ---- */
function aiSend(q){q=(q||'').trim();if(!q)return;const kind=S.role==='emp'?'part':'admin';const msgs=S.aiMsgs[S.role]=S.aiMsgs[S.role]||[];msgs.push({r:'u',t:q});const a=kind==='part'?partAnswer(q):adminAnswer(q);msgs.push({r:'a',html:a.html});
 if(kind==='admin')D.aiAudit.unshift({at:TODAY,who:meE().n,role:S.role,q,sum:a.sum,ok:a.ok!==false});render();const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}
ACT.aisend=()=>{const i=$('#aiq');aiSend(i?i.value:'')};
ACT.aichip=el=>aiSend(el.dataset.q);

/* ---- notifications & guide ---- */
const myNotes=()=>D.notes.filter(n=>n.to===me());
const unread=()=>myNotes().filter(n=>!n.read).length;
ACT.notif=()=>{const l=myNotes();drawer('Notifications',`<div class="row mb"><span class="sm mut">${unread()} unread</span><span class="sp"></span>${btn('Mark all read','readall',{},{sm:true})}</div>${l.length?l.map(n=>`<button class="card tight" style="width:100%;text-align:start;margin-bottom:10px;border-color:${n.read?'var(--line)':'#C5D3FA'}" data-act="openemail" data-id="${n.id}"><div class="row" style="gap:8px">${n.read?'':'<i style="width:8px;height:8px;border-radius:50%;background:var(--brand)"></i>'}<b class="sm" style="flex:1">${esc(n.subj)}</b>${badge(n.kind,'info')}</div><div class="xs mut mt">${fd(n.at)}</div></button>`).join(''):empty('No notifications')}`)};
ACT.readall=()=>{myNotes().forEach(n=>n.read=true);ACT.notif();render()};
ACT.openemail=el=>{const n=D.notes.find(x=>x.id===el.dataset.id);n.read=true;closeDrawer();modal({title:'Email preview',foot:false,body:`<div class="xs mut">To: ${esc(E(n.to)?E(n.to).n:TR(n.to).n)} · ${fd(n.at)} · (demo)</div><h3 class="mt mb">${esc(n.subj)}</h3><p>${esc(n.body)}</p><p class="xs mut mt">— Pahwa Group Learning & Development Platform</p>`});render()};
const GUIDE=[
 ['emp','Employee','Self-nominate','Pick a date for Communication Competence 1 and nominate. The one-date-per-programme rule and the '+'25-nomination limit are enforced.',()=>jump('emp','mine',{},{mine:'open'})],
 ['hod','HOD','Approve the nomination','See the request, the batch capacity and approve. Beyond 20 confirmed, nominees are waitlisted.',()=>jump('hod','appr',{},{appr:'pend'})],
 ['admin','HR / L&D','See the 25 / 20 rule in action','Batch B-26-02 is full: 20 confirmed, 3 waitlisted, 2 pending. Try promoting or cancelling.',()=>jump('admin','batches',{id:'B-26-02'},{batch:'noms'})],
 ['admin','HR / L&D','Run today’s attendance','Mark participants present, close attendance and see no-show notifications generated and impact tasks created.',()=>jump('admin','att',{attb:'B-18-01'})],
 ['emp','Employee','Give feedback','Once attendance is recorded, the feedback form opens: 1–5 ratings plus three takeaways.',()=>jump('emp','feedback')],
 ['admin','HR / L&D','Issue certificates','Eligible participants (attended, passed, feedback given) can be certified in one click.',()=>jump('admin','certs',{cb:'B-26-01'})],
 ['hod','HOD','Complete an impact assessment','Answer the Yes/No checklist. Mostly “No” gives a score below 3 and triggers a retraining recommendation.',()=>jump('hod','impact')],
 ['admin','HR / L&D','Review retraining','Approve a retraining recommendation so the employee becomes eligible to re-nominate.',()=>jump('admin','impact',{},{imp:'rt'})],
 ['admin','HR / L&D','Ask the data assistant','Try a supported question – and one that is out of scope to see the safe refusal.',()=>jump('admin','ai')],
 ['mgmt','Management','Company-wise view','Read-only consolidated view across BAA, DRI, DAI and TDS.',()=>jump('mgmt','cos')]];
ACT.guide=()=>drawer('Guided demo',`<p class="sm mut mb">Follow the journey end to end, or jump to any step. Each step switches role for you.</p>${GUIDE.map((g,i)=>`<button class="card tight" style="width:100%;text-align:start;margin-bottom:10px" data-act="gostep" data-i="${i}"><div class="row" style="gap:10px"><span class="av" style="background:${colorOf(g[1])};width:28px;height:28px;font-size:12px">${i+1}</span><div style="flex:1"><b class="sm">${g[2]}</b><div class="xs mut">${g[1]}</div></div>${ic('chev','sm')}</div><p class="xs mut mt">${g[3]}</p></button>`).join('')}`);
ACT.gostep=el=>{const g=GUIDE[+el.dataset.i];closeDrawer();g[4]();toast('Step '+(+el.dataset.i+1)+': '+g[2])};

/* ---- change / input handlers ---- */
CHG.role=el=>{S.role=el.value;S.view='dash';S.p={};S.tab={};S.ent='All';S.page=1;S.q='';S.fbForm=null;S.impForm=null;render();window.scrollTo(0,0)};
CHG.calprog=el=>{S.p.cp=el.value;render()};
CHG.attb=el=>{S.p.attb=el.value;render()};
CHG.fbb=el=>{S.p.fbb=el.value;render()};
CHG.certb=el=>{S.p.cb=el.value;render()};
CHG.bb=el=>{S.p.bb=el.value;render()};
CHG.chb=el=>{S.p.chb=el.value;render()};
CHG.dept=el=>{S.p.dept=el.value;S.page=1;render()};
CHG.per=el=>{S.p.per=el.value;S.page=1;render()};
CHG.nptpl=el=>{const d=document.getElementById('np_cust');if(d)d.style.display=el.value==='NEW'?'block':'none'};
CHG.cost=el=>{const c=D.costs[el.dataset.b];if(!c.act||c.recon)return;const v=Math.max(0,+el.value||0);c.act[el.dataset.k]=v;render()};
/* ============ demo persistence (browser only – no back end) ============ */
const SKEY='pahwa-lnd-demo-v2';
function saveState(clear){try{if(clear){localStorage.removeItem(SKEY);return}D._uid=_uid;D._today=TODAY.getTime();const j=JSON.stringify({D,DEPTS},function(k,v){if(['empById','batchById','progById','trById'].includes(k))return undefined;const o=this[k];if(o instanceof Date)return{$d:o.getTime()};return v});localStorage.setItem(SKEY,j)}catch(e){}}
function loadState(){try{const j=localStorage.getItem(SKEY);if(!j)return false;const o=JSON.parse(j,(k,v)=>v&&typeof v==='object'&&'$d' in v?new Date(v.$d):v);if(!o||!o.D||!o.D.emps||!o.D.outbox||o.D._today!==TODAY.getTime())return false;const d=o.D;d.empById=Object.fromEntries(d.emps.map(e=>[e.id,e]));d.progById=Object.fromEntries(d.progs.map(p=>[p.id,p]));d.batchById=Object.fromEntries(d.batches.map(b=>[b.id,b]));d.trById=Object.fromEntries(d.trainers.map(t=>[t.id,t]));
  Object.keys(o.DEPTS||{}).forEach(k=>{DEPTS[k]=o.DEPTS[k]});Object.assign(IMP_TPL,d.tplCustom||{});D=d;_uid=d._uid||_uid;return true}catch(e){return false}}
/* ============ render & boot ============ */
const BADGES=()=>{const o={};if(S.role==='hod'){o.appr=D.noms.filter(n=>n.status==='Pending HOD'&&E(n.emp)&&E(n.emp).mgr===ME.hod).length;o.impact=D.imp.filter(i=>i.status==='Pending'&&i.eval===ME.hod).length;o.retrain=D.retrain.filter(r=>r.status==='HOD review'&&E(r.emp)&&E(r.emp).mgr===ME.hod).length}
 if(S.role==='admin'){o.impact=D.retrain.filter(r=>r.status==='HR/L&D review').length}
 if(S.role==='emp'){o.feedback=pendingFb(me()).length;o.mine=invites(me()).length}return o};
function sidebar(){const r=ROLES.find(x=>x.id===S.role),bd=BADGES();
 return `<div class="brand" data-act="home"><div class="mk">P</div><div><b>Pahwa Group</b><span>Learning & Development</span></div><button class="ib" data-act="menu" aria-label="Hide menu" title="Hide menu" style="margin-inline-start:auto;background:transparent;border-color:rgba(255,255,255,.2);color:#fff">${ic('x')}</button></div>`+NAV[S.role].map(x=>x.length===1?`<div class="navh">${x[0]}</div>`:`<button class="nav ${S.view===x[0]?'on':''}" data-act="nav" data-id="${x[0]}" ${S.view===x[0]?'aria-current="page"':''}>${ic(x[2])}<span>${x[1]}</span>${bd[x[0]]?`<span class="ct">${bd[x[0]]}</span>`:''}</button>`).join('')+`<div class="sbfoot"><b style="color:#fff">${esc(r.short)} view</b><br>${esc(meE()?meE().n:TR(me()).n)}<br><span style="opacity:.8">Sample data · demonstration</span></div>`}
function titleOf(){const n=NAV[S.role].find(x=>x[0]===S.view);return n?n[1]:''}
function topbar(){const u=unread(),r=ROLES.find(x=>x.id===S.role);
 return `<button class="ib" data-act="menu" aria-label="Show or hide menu" title="Show or hide menu">${ic('menu')}</button><div class="tbt"><div class="t">${esc(titleOf())}</div><div class="s hide-m">${esc(r.n)}</div></div><span class="sp" style="flex:1"></span>
 <label class="pill" title="Switch role to see each user's view">${ic('user','sm')}<span class="hide-m mut xs">Demo: view as</span><select data-chg="role" aria-label="Viewing as role">${ROLES.map(x=>`<option value="${x.id}" ${x.id===S.role?'selected':''}>${esc(x.short)}</option>`).join('')}</select></label>
 <span class="badge warn hide-m" title="All people, companies and figures are fictional sample data">Sample data</span>
 <button class="btn sm hide-m" data-act="togglecq" aria-pressed="${S.hideCq?'false':'true'}" title="Show or hide the markers for decisions still open with Pahwa Group">${ic('flag','sm')}Open decisions: ${S.hideCq?'hidden':'shown'}</button>
 <button class="btn sm hide-m" data-act="guide">${ic('route','sm')}Guided demo</button>
 <button class="ib" data-act="notif" aria-label="Notifications">${ic('bell')}${u?`<span class="dot">${u}</span>`:''}</button>
 <button class="ib hide-m" data-act="reset" aria-label="Reset demo data" title="Reset demo data">${ic('refresh')}</button>`}
function render(){document.body.classList.remove('sbopen');
 const keepY=window.scrollY,ae=document.activeElement,aid=ae&&ae.id&&['pq','eq','aiq'].includes(ae.id)?ae.id:null,apos=aid?ae.selectionStart:0;
 try{const f=V[S.role+'.'+S.view];if(!f){S.view='dash'}
  $('#sb').innerHTML=sidebar();$('#tb').innerHTML=topbar();
  $('#simbar').innerHTML=`<b>DEMO</b><span>Interactive prototype · all employees, companies and figures are sample data · e-mail, calendar, single sign-on and AI are simulated · changes stay in this browser only.</span>`;
  $('#stage').innerHTML=`<div class="page">${V[S.role+'.'+S.view]()}</div>`;
 }catch(err){console.error(err);$('#stage').innerHTML=`<div class="card"><h3>Something went wrong showing this screen</h3><p class="sm mut mt">Please use “Reset demo data” and try again.</p>${btn('Reset demo data','reset')}</div>`}
 document.title='Pahwa Group · Learning & Development Platform';
 if(aid){const e=document.getElementById(aid);if(e){e.focus();try{e.setSelectionRange(apos,apos)}catch(x){}}}
 else window.scrollTo(0,keepY);saveState()}
function boot(){
 document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t){const f=ACT[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();f(t,e)}else console.warn('No action',t.dataset.act);return}
  if(e.target.id==='scrim'){closeDrawer();document.body.classList.remove('sbopen')}
  if(e.target.id==='ov')closeModal()});
 document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t)});
 document.addEventListener('input',e=>{const t=e.target;if(t.id==='pq'||t.id==='eq'){S.q=t.value;S.page=1;render()}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ov').classList.contains('on'))closeModal();else if($('#dr').classList.contains('on'))closeDrawer();document.body.classList.remove('sbopen')}
  if(e.key==='Enter'&&e.target.id==='aiq'){e.preventDefault();ACT.aisend()}});
 $('#bld').textContent='Build 2026-11-17';loadState();try{if(localStorage.getItem('pahwa-sbhide'))document.body.classList.add('sbhide')}catch(e){}render()}
boot();
</script>
